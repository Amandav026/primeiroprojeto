<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="Formulario para ofertas do livro de receitas. Preencha o formulário para receber ofertas exclusivas e atualizações sobre o livro de receitas.">
    <meta name="author" content="Amanda Viana">
    <title>Formulário de Ofertas</title>
</head>

<body><style> body { background-color: beige; } </style>
<h1>Formulário de Ofertas do Livro de Receitas</h1>
<p>Preencha o formulário abaixo para receber ofertas exclusivas e comprar livros de receitas.</p>
<form>
    <label for="nome">Nome:</label>
    <input type="text" name="nome" placeholder="Digite seu nome" required>
    <br><br>
    <label for="telefone">Telefone:</label>
    <input type="tel" name="telefone" placeholder="Digite seu telefone" required>   
    <br><br>
    <label for="email">Email:</label>
    <input type="email" name="email" placeholder="Digite seu email" required>
    <br><br>
    <label for="endereço">Endereço:</label>
    <input type="text" name="endereço" placeholder="Digite seu endereço" required>
    <label for="cep">CEP:</label>
    <input type="text" name="cep" placeholder="Digite seu CEP" required>
    <br><br>
    <label for="senha">Senha:</label>
    <input type="password" name="senha" placeholder="Digite sua senha" required>
    <br><br>
    <input type="submit" value="Enviar">
    <br><br>
</form>
    
<br>
<a href="index.html">Voltar para a página inicial</a>
<br>
</body>
</html>
